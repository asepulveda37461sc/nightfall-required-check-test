name: Fake AppSec Scan
# Posts "Nightfall DLP" through the API with GITHUB_TOKEN, the way the DLP scanner action does.
on: pull_request
permissions:
  checks: write
  contents: read
jobs:
  appsec:
    name: AppSec Scan
    runs-on: ubuntu-latest
    steps:
      - name: Post Nightfall DLP through the API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA='${{ github.event.pull_request.head.sha }}'
          ID=$(gh api "repos/${{ github.repository }}/check-runs" -f name='Nightfall DLP' -f head_sha="$SHA" -f status=in_progress --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/check-runs/$ID" -f status=completed -f conclusion=success -f 'output[title]=Nightfall DLP' -f 'output[summary]=0 findings'
