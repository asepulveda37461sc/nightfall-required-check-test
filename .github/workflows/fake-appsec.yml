name: Fake AppSec Scan
on: pull_request
permissions:
  checks: write
  contents: read
jobs:
  appsec:
    name: AppSec Scan
    runs-on: ubuntu-latest
    steps:
      - name: First attempt (left in_progress, like the run the 404 leaves behind)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" -f name='Nightfall DLP' -f head_sha='${{ github.event.pull_request.head.sha }}' -f status=in_progress --jq .id
      - name: Retry (new check run, completed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          ID=$(gh api "repos/${{ github.repository }}/check-runs" -f name='Nightfall DLP' -f head_sha='${{ github.event.pull_request.head.sha }}' -f status=in_progress --jq .id)
          for i in 1 2 3 4 5 6; do
            gh api -X PATCH "repos/${{ github.repository }}/check-runs/$ID" -f status=completed -f conclusion=success >/dev/null && exit 0
            sleep 3
          done
          exit 1
